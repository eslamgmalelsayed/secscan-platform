# Local development services. Bound to localhost only.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: secscan
      POSTGRES_PASSWORD: secscan_dev_only
      POSTGRES_DB: secscan
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
