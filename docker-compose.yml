# Local development services. Every port is bound to 127.0.0.1 only.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: secscan
      POSTGRES_PASSWORD: secscan_dev_only
      POSTGRES_DB: secscan
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
  # Catches owner sign-off emails locally. SMTP 127.0.0.1:1025, inbox http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  pgdata:
