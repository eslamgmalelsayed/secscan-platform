name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secscan
          POSTGRES_PASSWORD: secscan
          POSTGRES_DB: secscan
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U secscan"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://secscan:secscan@localhost:5432/secscan
      SECSCAN_TEST_DATABASE_URL: postgres://secscan:secscan@localhost:5432/secscan
      SECSCAN_TEST_REDIS_URL: redis://localhost:6379
      SECSCAN_FINGERPRINT_SECRET: ci-fixed-secret-for-reproducible-runs

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run generate -w @secscan/api
      - name: Apply migrations
        run: npm run db:migrate
      - name: Build (all packages + web)
        run: npm run build
      - name: Typecheck (lint)
        run: npm run lint
      - name: Test (against Postgres + Redis)
        run: npm test
      - name: API HTTP smoke
        run: npm run smoke -w @secscan/api
